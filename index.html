<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acturis Academy Certificate</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      background-color: #f0f0f0;
      font-family: 'Georgia', serif; 
    }
    .certificate-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 1200px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .certificate-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .cert-text {
      position: absolute;
      color: #0f1c2d; /* Matches the dark blue of the certificate text */
    }
    #cert-name {
      top: 43%; /* Adjust these percentages to perfectly align with the line */
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8vw; 
      text-align: center;
      width: 60%;
    }
    #cert-date {
      top: 74.5%; 
      left: 32%; 
      transform: translateX(-50%);
      font-size: 1.5vw;
    }
  </style>
</head>
<body>

  <div class="certificate-container">
    <img src="ContactFundamentals_Certificate.jpg" alt="Acturis Certificate of Completion">
    <div id="cert-name" class="cert-text"></div>
    <div id="cert-date" class="cert-text"></div>
  </div>
  <script>
    // Extract parameters from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const studentName = urlParams.get('name');
    const completionDate = urlParams.get('date');
    
    // Populate the HTML elements if the parameters exist
    if (studentName) {
      document.getElementById('cert-name').textContent = studentName;
    }
    if (completionDate) {
      document.getElementById('cert-date').textContent = completionDate;
    }
  </script>
</body>
</html>
